name: Release

# Tag pushes only. Deploys the website, which also serves Sparkle's appcast.xml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # TODO(#15): add a `build` job on macOS that archives, signs, notarizes and zips the app, publishes it to the GitHub
  # Release, then runs Sparkle's `generate_appcast` with the SPARKLE_ED_PRIVATE_KEY secret and uploads appcast.xml as
  # an artifact. `site` then `needs: build` and copies that appcast.xml into site/public before deploying.

  site:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Deploy with wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
